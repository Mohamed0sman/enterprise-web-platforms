<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>قيد — نظام إدارة الأعمال والمحاسبة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --canvas:#F1F2EF;
  --surface:#FFFFFF;
  --ink:#17201E;
  --ink-2:#3E4A46;
  --muted:#77837E;
  --rule:#DFE3DD;
  --rule-soft:#ECEEE9;
  --brand:#16403B;
  --brand-2:#1E5B54;
  --brand-soft:#E6EEEB;
  --gold:#A87C14;
  --gold-soft:#FBF2DC;
  --red:#9A3324;
  --red-soft:#FBEBE8;
  --green:#2C6B4F;
  --green-soft:#E7F1EB;
  --r:5px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:"IBM Plex Sans Arabic","IBM Plex Sans",system-ui,"Segoe UI",sans-serif;
  background:var(--canvas);color:var(--ink);
  font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased;
}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1;letter-spacing:-.01em}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:none}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:3px}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:#C9CFC9;border-radius:9px;border:2px solid var(--canvas)}
::-webkit-scrollbar-track{background:transparent}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:246px 1fr;min-height:100vh}
.nav{
  background:var(--brand);color:#CFDCD8;display:flex;flex-direction:column;
  position:sticky;top:0;height:100vh;overflow:hidden;
}
.brand{display:flex;align-items:center;gap:10px;padding:18px 18px 14px}
.mark{
  width:34px;height:34px;border-radius:7px;background:var(--gold);color:#1B1403;
  display:grid;place-items:center;font-weight:700;font-size:15px;flex:none;
}
.brand b{color:#fff;font-weight:600;font-size:16px;letter-spacing:.2px;display:block}
.brand span{font-size:11.5px;color:#89A29C;display:block;margin-top:-2px}
.org{
  margin:2px 12px 10px;padding:9px 11px;border-radius:var(--r);
  background:rgba(255,255,255,.055);border:1px solid rgba(255,255,255,.07);
}
.org b{display:block;color:#EAF1EF;font-size:12.5px;font-weight:500}
.org i{display:block;font-style:normal;font-size:11px;color:#89A29C;margin-top:1px}
.navscroll{flex:1;overflow-y:auto;padding:2px 10px 14px}
.navscroll::-webkit-scrollbar-thumb{background:rgba(255,255,255,.14);border-color:transparent}
.navgrp{font-size:10.5px;color:#6F8A84;padding:14px 8px 6px;font-weight:500}
.navitem{
  display:flex;align-items:center;gap:9px;width:100%;text-align:right;
  padding:8px 10px;border-radius:var(--r);color:#B9CBC6;font-size:13.5px;
  border-right:2px solid transparent;margin-bottom:1px;
}
.navitem:hover{background:rgba(255,255,255,.06);color:#fff}
.navitem.on{background:rgba(255,255,255,.1);color:#fff;border-right-color:var(--gold);font-weight:500}
.navitem svg{width:16px;height:16px;flex:none;opacity:.85}
.navitem .tag{margin-inline-start:auto;font-size:10.5px;background:var(--gold);color:#1B1403;border-radius:20px;padding:0 6px;font-weight:600}
.navfoot{padding:10px 14px 14px;border-top:1px solid rgba(255,255,255,.08);font-size:11px;color:#7E9691;display:flex;justify-content:space-between;align-items:center}
.dot-ok{width:7px;height:7px;border-radius:50%;background:#5FD0A5;display:inline-block;margin-inline-end:5px}

main{min-width:0;display:flex;flex-direction:column}
.topbar{
  position:sticky;top:0;z-index:30;background:rgba(241,242,239,.92);backdrop-filter:blur(8px);
  border-bottom:1px solid var(--rule);padding:11px 22px;display:flex;align-items:center;gap:14px;
}
.crumb{display:flex;align-items:baseline;gap:8px;min-width:0}
.crumb h1{font-size:17px;font-weight:600;letter-spacing:-.2px;white-space:nowrap}
.crumb em{font-style:normal;color:var(--muted);font-size:12.5px;white-space:nowrap}
.search{
  margin-inline-start:auto;position:relative;width:270px;max-width:32vw;
}
.search input{
  width:100%;background:var(--surface);border:1px solid var(--rule);border-radius:var(--r);
  padding:7px 32px 7px 10px;font-size:13px;
}
.search input::placeholder{color:#9AA5A0}
.search svg{position:absolute;right:10px;top:8px;width:14px;height:14px;color:#9AA5A0}
.pick{
  display:flex;align-items:center;gap:7px;background:var(--surface);border:1px solid var(--rule);
  border-radius:var(--r);padding:6px 10px;font-size:12.5px;white-space:nowrap;
}
.pick b{font-weight:500}
.pick svg{width:15px;height:15px;flex:none;color:var(--muted)}
.pick select{border:none;background:none;font-size:12.5px;font-weight:500;cursor:pointer;max-width:150px}
.iconbtn{
  width:32px;height:32px;border:1px solid var(--rule);background:var(--surface);border-radius:var(--r);
  display:grid;place-items:center;position:relative;color:var(--ink-2)
}
.iconbtn:hover{border-color:#C6CCC5}
.iconbtn svg{width:16px;height:16px}
.bell-dot{position:absolute;top:5px;right:6px;width:6px;height:6px;background:var(--red);border-radius:50%;border:1.5px solid var(--surface)}
.me{display:flex;align-items:center;gap:8px;padding-inline-start:12px;border-inline-start:1px solid var(--rule)}
.avatar{width:30px;height:30px;border-radius:50%;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center;font-weight:600;font-size:12px}
.me small{display:block;color:var(--muted);font-size:11px;margin-top:-2px}
.me b{font-size:12.5px;font-weight:500}

.view{padding:20px 22px 46px;flex:1}
.view.flush{padding:0}

/* ---------- panels & primitives ---------- */
.panel{background:var(--surface);border:1px solid var(--rule);border-radius:var(--r)}
.phead{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--rule-soft)}
.phead h2{font-size:13.5px;font-weight:600}
.phead .sub{font-size:11.5px;color:var(--muted)}
.phead .right{margin-inline-start:auto;display:flex;gap:6px;align-items:center}
.pad{padding:14px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:1fr 1fr}
.g3{grid-template-columns:repeat(3,1fr)}
.g-main{grid-template-columns:1fr 316px;align-items:start}
.g-hero{grid-template-columns:1.62fr 1fr}

.btn{
  background:var(--brand);color:#fff;border-radius:var(--r);padding:7px 13px;font-size:12.5px;font-weight:500;
  display:inline-flex;align-items:center;gap:6px;border:1px solid var(--brand)
}
.btn:hover{background:var(--brand-2)}
.btn svg{width:14px;height:14px}
.btn.ghost{background:var(--surface);color:var(--ink-2);border-color:var(--rule)}
.btn.ghost:hover{background:#F7F8F6;border-color:#C6CCC5}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#fff}
.btn.gold:hover{filter:brightness(1.06)}
.btn.sm{padding:5px 9px;font-size:12px}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;padding:2px 7px;border-radius:20px;font-weight:500}
.chip.pos{background:var(--green-soft);color:var(--green)}
.chip.neg{background:var(--red-soft);color:var(--red)}
.chip.warn{background:var(--gold-soft);color:var(--gold)}
.chip.mute{background:#F0F2EF;color:var(--muted)}
.lbl{font-size:11.5px;color:var(--muted)}
.sep{height:1px;background:var(--rule-soft)}

table{width:100%;border-collapse:collapse}
.tbl th{
  text-align:right;font-size:11.5px;font-weight:500;color:var(--muted);
  padding:8px 12px;border-bottom:1px solid var(--rule);white-space:nowrap;background:#FAFBF9
}
.tbl td{padding:9px 12px;border-bottom:1px solid var(--rule-soft);font-size:13px;vertical-align:middle}
.tbl tbody tr:hover{background:#FAFBF9}
.tbl tr:last-child td{border-bottom:none}
.tbl .t-l{text-align:left}
.tbl .t-c{text-align:center}
.tbl tfoot td{background:#FAFBF9;font-weight:600;border-top:1px solid var(--rule);font-size:13px}
.t-scroll{overflow:auto;max-height:420px}
.mini{font-size:11.5px;color:var(--muted);display:block}

.field{display:block;margin-bottom:11px}
.field span{display:block;font-size:11.5px;color:var(--muted);margin-bottom:4px}
.field input,.field select,.field textarea{
  width:100%;border:1px solid var(--rule);border-radius:4px;padding:7px 9px;font-size:13px;background:var(--surface)
}
.field input:focus,.field select:focus{border-color:var(--brand-2);outline:none;box-shadow:0 0 0 3px var(--brand-soft)}
.inline-in{border:1px solid transparent;border-radius:4px;padding:4px 6px;font-size:13px;width:100%;background:transparent}
.inline-in:hover{border-color:var(--rule)}
.inline-in:focus{border-color:var(--brand-2);background:#fff;outline:none}

.bar{height:6px;background:var(--rule-soft);border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--brand-2);border-radius:6px}
.bar i.gold{background:var(--gold)}
.bar i.red{background:var(--red)}

/* ---------- dashboard hero ---------- */
.hero{position:relative;overflow:hidden;min-height:224px;display:flex;flex-direction:column}
.hero .top{padding:16px 16px 0;position:relative;z-index:2}
.hero .fig{font-size:42px;font-weight:600;letter-spacing:-1.4px;line-height:1.1;margin-top:2px}
.hero .fig small{font-size:16px;font-weight:400;color:var(--muted);letter-spacing:0;margin-inline-start:4px}
.hero .meta{display:flex;gap:14px;align-items:center;margin-top:8px;flex-wrap:wrap}
.hero svg.area{width:100%;height:120px;display:block;margin-top:auto}
.hero .months{display:flex;justify-content:space-between;padding:0 14px 10px;font-size:10.5px;color:#9AA5A0}

.cells{display:grid;grid-template-columns:repeat(4,1fr)}
.cell{padding:13px 15px;border-inline-start:1px solid var(--rule-soft)}
.cell:first-child{border:none}
.cell b{display:block;font-size:20px;font-weight:600;letter-spacing:-.5px;margin:3px 0 2px}
.cell .lbl{font-size:11.5px}

.stack{display:flex;flex-direction:column}
.row-i{display:flex;align-items:center;gap:10px;padding:9px 14px;border-bottom:1px solid var(--rule-soft);font-size:13px}
.row-i:last-child{border-bottom:none}
.row-i .amt{margin-inline-start:auto;font-weight:500}
.swatch{width:26px;height:26px;border-radius:5px;display:grid;place-items:center;flex:none;background:var(--brand-soft);color:var(--brand)}
.swatch svg{width:14px;height:14px}
.swatch.g{background:var(--gold-soft);color:var(--gold)}
.swatch.r{background:var(--red-soft);color:var(--red)}
.swatch.v{background:var(--green-soft);color:var(--green)}

.rank{display:flex;align-items:center;gap:10px;padding:8px 14px}
.rank .nm{width:118px;font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rank .bar{flex:1}
.rank .vl{font-size:12px;color:var(--muted);width:62px;text-align:left}

/* ---------- POS ---------- */
.posv{display:grid;grid-template-columns:1fr 372px;height:calc(100vh - 55px)}
.pos-left{display:flex;flex-direction:column;min-width:0;background:var(--canvas)}
.pos-bar{display:flex;gap:8px;padding:12px 16px;align-items:center;border-bottom:1px solid var(--rule);background:var(--surface);flex-wrap:wrap}
.cats{display:flex;gap:6px;overflow:auto;padding-bottom:2px}
.cat{padding:5px 11px;border:1px solid var(--rule);border-radius:20px;font-size:12.5px;white-space:nowrap;background:var(--surface)}
.cat.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:10px;padding:14px 16px;overflow:auto}
.pcard{background:var(--surface);border:1px solid var(--rule);border-radius:var(--r);padding:10px;text-align:right;position:relative;transition:transform .08s}
.pcard:hover{border-color:var(--brand-2)}
.pcard:active{transform:scale(.975)}
.pcard .ic{height:46px;border-radius:4px;background:var(--brand-soft);display:grid;place-items:center;color:var(--brand);font-size:17px;font-weight:600;margin-bottom:8px}
.pcard b{display:block;font-size:12.5px;font-weight:500;line-height:1.35;min-height:34px}
.pcard .pr{display:flex;justify-content:space-between;align-items:center;margin-top:6px;font-size:12.5px}
.pcard .st{color:var(--muted);font-size:11px}
.pcard .st.low{color:var(--red)}
.cart{background:var(--surface);border-inline-start:1px solid var(--rule);display:flex;flex-direction:column;height:100%}
.cart-head{padding:12px 14px;border-bottom:1px solid var(--rule);display:flex;align-items:center;gap:8px}
.cart-lines{flex:1;overflow:auto}
.cline{display:grid;grid-template-columns:1fr auto;gap:4px 8px;padding:10px 14px;border-bottom:1px solid var(--rule-soft)}
.cline b{font-size:12.5px;font-weight:500}
.qty{display:flex;align-items:center;gap:0;border:1px solid var(--rule);border-radius:4px;overflow:hidden;width:fit-content}
.qty button{width:24px;height:24px;font-size:14px;color:var(--ink-2);line-height:1}
.qty button:hover{background:#F2F4F1}
.qty span{width:30px;text-align:center;font-size:12.5px;border-inline:1px solid var(--rule)}
.cart-sum{border-top:1px solid var(--rule);padding:12px 14px;background:#FAFBF9}
.sum-r{display:flex;justify-content:space-between;font-size:12.5px;padding:3px 0;color:var(--ink-2)}
.sum-r.total{font-size:18px;font-weight:600;color:var(--ink);padding-top:8px;margin-top:6px;border-top:1px dashed var(--rule)}
.pay-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px;margin-top:11px}
.empty{display:grid;place-items:center;height:100%;text-align:center;color:var(--muted);font-size:12.5px;padding:26px;gap:8px}
.empty svg{width:34px;height:34px;color:#C4CCC7}

/* ---------- misc ---------- */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--rule);margin-bottom:16px;overflow:auto}
.tab{padding:8px 13px;font-size:13px;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}
.tab.on{color:var(--ink);border-bottom-color:var(--brand);font-weight:500}
.tree-n{display:flex;align-items:center;gap:8px;padding:7px 12px;border-bottom:1px solid var(--rule-soft);font-size:13px}
.tree-n .code{color:var(--muted);font-size:12px;width:52px}
.tree-n .amt{margin-inline-start:auto;font-weight:500;font-size:12.5px}
.lv1{font-weight:600;background:#FAFBF9}
.lv2{padding-inline-start:30px}
.lv3{padding-inline-start:52px;color:var(--ink-2)}

.toast{
  position:fixed;bottom:20px;left:20px;z-index:90;background:var(--ink);color:#fff;
  padding:11px 15px;border-radius:var(--r);font-size:13px;display:flex;gap:9px;align-items:center;
  box-shadow:0 8px 26px rgba(20,30,28,.22);transform:translateY(14px);opacity:0;pointer-events:none;transition:.22s
}
.toast.show{transform:none;opacity:1}
.toast svg{width:15px;height:15px;color:#6FD3A8}
.modal-bg{position:fixed;inset:0;background:rgba(18,26,24,.4);z-index:80;display:none;place-items:center;padding:20px}
.modal-bg.show{display:grid}
.modal{background:var(--surface);border-radius:7px;width:min(440px,100%);overflow:hidden;box-shadow:0 22px 60px rgba(15,25,22,.3)}
.modal-h{padding:14px 16px;border-bottom:1px solid var(--rule-soft);display:flex;align-items:center}
.modal-h b{font-size:14px}
.modal-h button{margin-inline-start:auto;color:var(--muted);font-size:18px;line-height:1}
.pop{
  position:absolute;top:46px;left:22px;width:326px;background:var(--surface);border:1px solid var(--rule);
  border-radius:var(--r);box-shadow:0 14px 40px rgba(15,25,22,.16);z-index:40;display:none;overflow:hidden
}
.pop.show{display:block}
.note{display:flex;gap:10px;padding:11px 13px;border-bottom:1px solid var(--rule-soft);font-size:12.5px;align-items:flex-start}
.note:last-child{border:none}
.note time{display:block;color:var(--muted);font-size:11px;margin-top:2px}

.kbd{border:1px solid var(--rule);border-bottom-width:2px;border-radius:4px;padding:0 5px;font-size:11px;color:var(--muted);background:#FAFBF9}

/* entrance: single orchestrated load */
@media (prefers-reduced-motion:no-preference){
  .app{animation:fade .3s ease}
  .view>*{animation:rise .34s cubic-bezier(.22,.7,.3,1) backwards}
  .view>*:nth-child(2){animation-delay:.05s}
  .view>*:nth-child(3){animation-delay:.1s}
  .view>*:nth-child(4){animation-delay:.14s}
}
@keyframes fade{from{opacity:0}}
@keyframes rise{from{opacity:0;transform:translateY(7px)}}

@media(max-width:1180px){
  .g-main,.g-hero{grid-template-columns:1fr}
  .posv{grid-template-columns:1fr 320px}
}
@media(max-width:900px){
  .app{grid-template-columns:1fr}
  .nav{position:fixed;inset-inline-start:0;top:0;width:246px;z-index:60;transform:translateX(100%);transition:.2s}
  .nav.open{transform:none;box-shadow:-10px 0 40px rgba(0,0,0,.2)}
  .burger{display:grid!important}
  .search{display:none}
  .g2,.g3,.cells{grid-template-columns:1fr 1fr}
  .posv{grid-template-columns:1fr;height:auto}
  .cart{border-inline-start:none;border-top:1px solid var(--rule)}
  .me small{display:none}
}
.burger{display:none}
</style>
</head>
<body>
<div class="app" id="app"></div>
<div class="toast" id="toast"></div>
<div class="modal-bg" id="modalbg"><div class="modal" id="modal"></div></div>
<script>
/* ============ بيانات تجريبية ============ */
const DB = {

  ],

  profit:[118,131,142,126,149,163,155,171,168,186,194,212],
  products:[

    {n:"شاشة سامسونج 27 بوصة",c:"إلكترونيات",p:1120,s:41,u:"قطعة",b:"6281000110052"},
    {n:"طابعة HP LaserJet M404",c:"إلكترونيات",p:1690,s:7,u:"قطعة",b:"6281000110069"},
    {n:"كرسي مكتبي شبك",c:"أثاث",p:740,s:63,u:"قطعة",b:"6281000110076"},
    {n:"مكتب خشبي 160سم",c:"أثاث",p:1250,s:18,u:"قطعة",b:"6281000110083"},
    {n:"خزانة ملفات معدنية",c:"أثاث",p:980,s:4,u:"قطعة",b:"6281000110090"},
    {n:"ورق تصوير A4 — كرتون",c:"قرطاسية",p:145,s:210,u:"كرتون",b:"6281000110106"},
    {n:"حبر طابعة أصلي 59A",c:"قرطاسية",p:420,s:32,u:"علبة",b:"6281000110113"},
    {n:"دفتر تحضير 100 ورقة",c:"قرطاسية",p:12,s:1240,u:"حبة",b:"6281000110120"},
    {n:"عقد صيانة سنوي — ذهبي",c:"خدمات",p:6500,s:null,u:"عقد",b:"SRV-G-01"},
    {n:"تركيب وتشغيل شبكة",c:"خدمات",p:2200,s:null,u:"ساعة عمل",b:"SRV-N-02"},
    {n:"استضافة سحابية — سنوي",c:"خدمات",p:3400,s:null,u:"اشتراك",b:"SRV-H-03"},
  ],

function spark(vals,w=680,h=120){
  const mn=Math.min(...vals)*.86,mx=Math.max(...vals)*1.04,rg=mx-mn||1;
  const pt=i=>[ (i/(vals.length-1))*w, h-((vals[i]-mn)/rg)*(h-10)-6 ];
  let d="",a="";
  vals.forEach((v,i)=>{const[x,y]=pt(i);if(i){const[px,py]=pt(i-1);const cx=(px+x)/2;d+=` C${cx},${py} ${cx},${y} ${x},${y}`}else d=`M${x},${y}`});
  a=d+` L${w},${h} L0,${h} Z`;
  const[lx,ly]=pt(vals.length-1);
  return `<svg class="area" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" aria-hidden="true">
    <defs><linearGradient id="ag" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1E5B54" stop-opacity=".17"/><stop offset="1" stop-color="#1E5B54" stop-opacity="0"/>
    </linearGradient></defs>
    <path d="${a}" fill="url(#ag)"/><path d="${d}" fill="none" stroke="#1E5B54" stroke-width="2" vector-effect="non-scaling-stroke"/>
    <circle cx="${lx}" cy="${ly}" r="3.4" fill="#A87C14"/></svg>`;
}
function bars(data,h=150){
  const mx=Math.max(...data.map(d=>d[1]));const rev=[...data].reverse();
  return `<svg viewBox="0 0 300 ${h}" style="width:100%;height:${h}px;display:block">
  ${rev.map((d,i)=>{const bh=(d[1]/mx)*(h-24),x=i*(300/rev.length)+6,bw=300/rev.length-12;
   return `<rect x="${x}" y="${h-18-bh}" width="${bw}" height="${bh}" rx="2" fill="${i===0?'#A87C14':'#1E5B54'}" opacity="${i===0?1:.82}"/>
   <text x="${x+bw/2}" y="${h-5}" font-size="9" fill="#77837E" text-anchor="middle">${d[0]}</text>`}).join("")}
  </svg>`;
}
function donut(parts){
  let a=0,R=52,C=2*Math.PI*R,tot=parts.reduce((s,p)=>s+p[1],0);
  const segs=parts.map(p=>{const len=p[1]/tot*C,s=`<circle r="${R}" cx="70" cy="70" fill="none" stroke="${p[2]}" stroke-width="17" stroke-dasharray="${len-2} ${C-len+2}" stroke-dashoffset="${-a}" transform="rotate(-90 70 70)"/>`;a+=len;return s}).join("");
  return `<svg viewBox="0 0 140 140" style="width:140px;height:140px;flex:none">${segs}</svg>`;
}

    <div class="panel" style="align-self:start"><div class="phead"><h2>إجراءات الأصل</h2></div>
      <div class="stack">
        ${[["نقل أصل بين الفروع","يولّد سند نقل ويحدّث الموقع"],["بيع أصل","يحتسب الربح أو الخسارة آليًا"],["استبعاد / تخريد","يقفل مجمع الإهلاك"],["إعادة تقييم","تعديل القيمة الدفترية بقيد"],["صيانة دورية","جدولة وتنبيه قبل الموعد"]]
        .map(r=>`<button class="row-i" style="width:100%;text-align:right;border:none;border-bottom:1px solid var(--rule-soft)" data-toast="${r[0]} — فُتحت الشاشة">
        <span class="swatch">${svg('<path d="M3 21h18M5 21V9l7-5 7 5v12"/>')}</span><div><span>${r[0]}</span><span class="mini">${r[1]}</span></div>
        <span class="amt lbl">›</span></button>`).join("")}

};

/* ============ الإعدادات ============ */

      <div class="panel"><div class="phead"><h2>البيانات الأساسية</h2></div>
        <div class="pad" style="display:grid;grid-template-columns:1fr 1fr;gap:0 16px">
          <label class="field"><span>اسم المنشأة</span><input value="${DB.org}"></label>
          <label class="field"><span>الرقم الضريبي</span><input class="num" value="${DB.vat}"></label>
          <label class="field"><span>العملة الأساسية</span><select><option>ريال سعودي (ر.س)</option><option>درهم إماراتي</option><option>دولار أمريكي</option></select></label>
          <label class="field"><span>بداية السنة المالية</span><select><option>1 يناير</option><option>1 يوليو</option></select></label>
          <label class="field"><span>طريقة تسعير المخزون</span><select><option>المتوسط المرجح</option><option>الوارد أولًا صادر أولًا</option></select></label>
          <label class="field"><span>لغة الواجهة</span><select><option>العربية</option><option>English</option></select></label>
        </div>

      </div>
    </div>
    <div class="grid" style="align-content:start">
      <div class="panel"><div class="phead"><h2>الفروع والمستودعات</h2></div>
        <div class="stack">
          ${DB.branches.map(b=>`<div class="row-i"><span class="swatch">${svg('<path d="M3 21h18M5 21V7l7-4 7 4v14"/>')}</span><div><span>${b.name}</span><span class="mini">صندوق ومخزون مستقل</span></div><span class="amt chip pos">فعّال</span></div>`).join("")}
          ${DB.stores.map(s=>`<div class="row-i"><span class="swatch v">${svg('<path d="M3 8l9-5 9 5-9 5z"/><path d="M3 8v8l9 5 9-5V8"/>')}</span><span>${s}</span></div>`).join("")}
        </div>
        <div class="pad" style="border-top:1px solid var(--rule)"><button class="btn ghost" style="width:100%" data-toast="فُتحت شاشة إضافة فرع">إضافة فرع أو مستودع</button></div>
      </div>
      <div class="panel"><div class="phead"><h2>سجل النشاط</h2></div>
        <div class="stack">
          ${[["خالد السالم","اعتمد أمر شراء PO-0451","قبل 12 دقيقة"],["منى الزهراني","رحّلت قيد JV-2026-0910","قبل ساعة"],["نورة المطيري","أغلقت وردية الكاشير","أمس 11:04 م"]]
          .map(l=>`<div class="row-i"><div><span><b style="font-weight:500">${l[0]}</b> — ${l[1]}</span><span class="mini">${l[2]}</span></div></div>`).join("")}

/* ============ التفاعل ============ */
function bindView(){
  const v=$("#view");
  v.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{if(b.dataset.tab===""){return}state.tab=+b.dataset.tab;shell()});
  v.querySelectorAll("[data-toast]").forEach(b=>b.onclick=()=>toast(b.dataset.toast));
  v.querySelectorAll("[data-cat]").forEach(b=>b.onclick=()=>{state.cat=b.dataset.cat;shell()});
  v.querySelectorAll("[data-add]").forEach(b=>b.onclick=()=>{
    const p=DB.products[+b.dataset.add], l=state.cart.find(x=>x.n===p.n);
    l?l.q++:state.cart.push({n:p.n,p:p.p,q:1});shell();
  });
  v.querySelectorAll("[data-q]").forEach(b=>b.onclick=()=>{
    const[i,d]=b.dataset.q.split(",").map(Number);state.cart[i].q+=d;
    if(state.cart[i].q<1)state.cart.splice(i,1);shell();
  });
  v.querySelectorAll("[data-clear]").forEach(b=>b.onclick=()=>{state.cart=[];shell()});
  v.querySelectorAll("[data-pay]").forEach(b=>b.onclick=()=>{
    if(!state.cart.length)return toast("أضف صنفًا واحدًا على الأقل قبل الدفع");
    const sub=state.cart.reduce((s,l)=>s+l.p*l.q,0),disc=Math.round(sub*.02),tot=sub-disc+Math.round((sub-disc)*DB.taxRate);
    modal(`<div class="modal-h"><b>تم إتمام البيع</b><button onclick="closeModal()">✕</button></div>
      <div class="pad" style="text-align:center">
        <div style="font-size:30px;font-weight:600" class="num">${money(tot,2)} <span class="lbl" style="font-size:15px">ر.س</span></div>
        <span class="chip pos" style="margin-top:6px">${b.dataset.pay}</span>
        <div class="sep" style="margin:14px 0"></div>
        <div style="display:grid;gap:5px;font-size:12.5px;text-align:right">
          <div class="sum-r"><span>رقم الفاتورة</span><b>POS-9922</b></div>
          <div class="sum-r"><span>عدد الأصناف</span><b class="num">${state.cart.length}</b></div>
          <div class="sum-r"><span>الكاشير</span><b>نورة سعد</b></div>
          <div class="sum-r"><span>القيد المحاسبي</span><b>رُحّل تلقائيًا</b></div>
        </div>
        <div style="display:flex;gap:7px;margin-top:16px">
          <button class="btn" style="flex:1" onclick="closeModal();toast('تمت طباعة الإيصال')">طباعة الإيصال</button>
          <button class="btn ghost" style="flex:1" onclick="closeModal()">فاتورة جديدة</button>
        </div>
      </div>`);
    state.cart=[];shell();
  });
  v.querySelectorAll("[data-shift]").forEach(b=>b.onclick=()=>modal(`<div class="modal-h"><b>إغلاق وردية الكاشير #4412</b><button onclick="closeModal()">✕</button></div>
    <div class="pad"><table class="tbl">
      <tr><td>رصيد افتتاحي</td><td class="t-l num">1,000.00</td></tr>
      <tr><td>مبيعات نقدية</td><td class="t-l num">11,380.00</td></tr>
      <tr><td>مبيعات شبكة</td><td class="t-l num">8,420.00</td></tr>
      <tr><td>مرتجعات</td><td class="t-l num" style="color:var(--red)">−340.00</td></tr>
      <tr><td>المتوقع في الدرج</td><td class="t-l num" style="font-weight:600">12,040.00</td></tr>
    </table>
    <label class="field" style="margin-top:12px"><span>النقد الفعلي في الدرج</span><input class="num" value="12,040.00"></label>
    <button class="btn" style="width:100%" onclick="closeModal();toast('أُغلقت الوردية — لا يوجد عجز أو زيادة')">إغلاق الوردية وترحيل القيد</button></div>`));
  v.querySelectorAll("[data-modal='transfer']").forEach(b=>b.onclick=()=>modal(`<div class="modal-h"><b>تحويل بين المستودعات</b><button onclick="closeModal()">✕</button></div>
    <div class="pad">
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:0 12px">
        <label class="field"><span>من مستودع</span><select>${DB.stores.map(s=>`<option>${s}</option>`).join("")}</select></label>
        <label class="field"><span>إلى مستودع</span><select>${DB.stores.slice(1).map(s=>`<option>${s}</option>`).join("")}</select></label>
      </div>
      <label class="field"><span>الصنف</span><select>${DB.products.filter(p=>p.s!==null).map(p=>`<option>${p.n}</option>`).join("")}</select></label>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:0 12px">
        <label class="field"><span>الكمية</span><input class="num" value="5"></label>
        <label class="field"><span>تاريخ التحويل</span><input value="12/09/2026"></label>
      </div>
      <button class="btn" style="width:100%" onclick="closeModal();toast('تم تنفيذ التحويل TR-0189 وتحديث الأرصدة')">تنفيذ التحويل</button>
    </div>`));
  v.querySelectorAll("[data-line]").forEach(inp=>inp.oninput=()=>{
    const i=+inp.dataset.line,val=Math.max(0,+inp.value||0);
    state.inv[i][inp.dataset.k]=val;
    const sel=`[data-line="${i}"][data-k="${inp.dataset.k}"]`;shell();
    const n=$(sel);if(n){n.focus();n.setSelectionRange?.(n.value.length,n.value.length)}
  });
  v.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{state.inv.splice(+b.dataset.del,1);shell()});
  v.querySelectorAll("[data-addline]").forEach(b=>b.onclick=()=>{
    const used=state.inv.map(l=>l.i),nx=DB.products.findIndex((p,i)=>!used.includes(i));
    if(nx<0)return toast("كل الأصناف مضافة للفاتورة");
    state.inv.push({i:nx,q:1,p:DB.products[nx].p});shell();
  });
  v.querySelectorAll("[data-save]").forEach(b=>b.onclick=()=>toast("اعتُمدت الفاتورة INV-2026-1185 وتم ترحيل القيد وتحديث المخزون"));
  v.querySelectorAll("[data-je]").forEach(inp=>inp.oninput=()=>{
    const i=+inp.dataset.je;state.je[i][inp.dataset.k]=+inp.value||0;
    const sel=`[data-je="${i}"][data-k="${inp.dataset.k}"]`;shell();
    const n=$(sel);if(n){n.focus();n.setSelectionRange?.(n.value.length,n.value.length)}
  });
  v.querySelectorAll("[data-jeadd]").forEach(b=>b.onclick=()=>{state.je.push({a:"5104 مصاريف تشغيلية",d:0,c:0});shell()});
  v.querySelectorAll("[data-jedel]").forEach(b=>b.onclick=()=>{state.je.splice(+b.dataset.jedel,1);shell()});
  v.querySelectorAll("[data-jesave]").forEach(b=>b.onclick=()=>toast("رُحّل القيد JV-2026-0913 إلى دفتر الأستاذ"));
  const bc=$("#bc");
  if(bc)bc.onkeydown=e=>{
    if(e.key!=="Enter")return;
    const q=bc.value.trim();const p=DB.products.find(x=>x.b===q||x.n.includes(q));
    if(!p)return toast("لا يوجد صنف بهذا الباركود");
    const l=state.cart.find(x=>x.n===p.n);l?l.q++:state.cart.push({n:p.n,p:p.p,q:1});shell();$("#bc")?.focus();
  };
}
shell();
</script>
